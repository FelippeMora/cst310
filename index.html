<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop - CST 310</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Cart (<span id="cart-count">0</span>)</a>
    </nav>

    <main>
        <h1>Felippe's Online Shop</h1>

        <section class="product">
            <h2>Wireless Mechanical Keyboard</h2>
            <p>Category: Electronics</p>
            <p>Price: $89.99</p>
            <p>Status: In Stock</p>
        </section>
    </main>

    <script src="app.js"></script>

</body>
</html>
